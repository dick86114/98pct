# 九成八发版管理平台 Docker Compose 配置
services:
  98pct:
    image: ghcr.io/dick86114/98pct:latest
    container_name: 98pct
    ports:
      - "9898:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      # 持久化上传的文件
      - ./uploads:/app/public/uploads
    restart: unless-stopped
    network_mode: bridge
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
